name: Release

# Push a tag matching the manifest version (e.g. v0.1.0) to build the Chrome Web Store zip
# and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version v$v"
            exit 1
          fi
      - run: npm test
      - run: scripts/package.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "LazyScroll $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $flags
